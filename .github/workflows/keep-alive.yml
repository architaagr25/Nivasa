name: Keep alive

# Supabase pauses a free project after a week without activity. Running the reminder job once
# a day touches the database through the app, which also proves the deployment still answers.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run the reminder job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/jobs/reminders"
